# Keeps this fork current with CleanYourTV: every day, merges Gathin23/cleanyourtv's main into main.
#
# The fork only adds files, except README.md and README.pt-BR.md, which are the fork's own: upstream's go to
# README.cleanyourtv.md and README.cleanyourtv.pt-BR.md on every sync (with a line pointing back here), so neither
# stays in conflict.
# Any other conflict, or a push GitHub refuses, opens one issue with what to run by hand.
#
# Pushing a merge that brings upstream changes to .github/workflows needs a token with the "workflows" permission:
# add a fine-grained token (this repository; Contents and Workflows: read and write) as the SYNC_TOKEN secret.
# Without it, the built-in token is used, and those merges end in the issue.
name: Sync with CleanYourTV

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'matheus-caldeira/cleanyourtv-ui'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Merge upstream main
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Gathin23/cleanyourtv.git
          git fetch --no-tags upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already current with upstream."
            echo "status=current" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git merge --no-commit --no-ff upstream/main || true
          # README.md and README.pt-BR.md are ours; upstream's go to README.cleanyourtv.md and
          # README.cleanyourtv.pt-BR.md, with their links between the two pointed at the copies.
          git checkout --ours README.md 2>/dev/null || git checkout HEAD -- README.md
          git checkout --ours README.pt-BR.md 2>/dev/null || git checkout HEAD -- README.pt-BR.md
          {
            echo "> **CleanYourTV UI:** this is [CleanYourTV](https://github.com/Gathin23/cleanyourtv)'s README, copied on every sync. This fork's is [README.md](README.md) ([Português](README.pt-BR.md))."
            echo
            git show upstream/main:README.md | sed 's/README\.pt-BR\.md/README.cleanyourtv.pt-BR.md/g'
          } > README.cleanyourtv.md
          if git cat-file -e upstream/main:README.pt-BR.md 2>/dev/null; then
            {
              echo "> **CleanYourTV UI:** este é o README em português do [CleanYourTV](https://github.com/Gathin23/cleanyourtv), copiado a cada sync. O deste fork é o [README.pt-BR.md](README.pt-BR.md)."
              echo
              git show upstream/main:README.pt-BR.md | sed -e 's/"README\.md"/"README.cleanyourtv.md"/g' -e 's/(README\.md)/(README.cleanyourtv.md)/g'
            } > README.cleanyourtv.pt-BR.md
            git add README.cleanyourtv.pt-BR.md
          fi
          git add README.md README.pt-BR.md README.cleanyourtv.md
          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            echo "Conflicts:"; git diff --name-only --diff-filter=U
            git merge --abort
            echo "status=conflict" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit --no-edit -m "Merge CleanYourTV (upstream main)"
          if git push origin HEAD:main; then
            echo "status=merged" >> "$GITHUB_OUTPUT"
          else
            echo "status=push-refused" >> "$GITHUB_OUTPUT"
          fi

      - name: Open an issue when it needs a hand
        if: steps.merge.outputs.status == 'conflict' || steps.merge.outputs.status == 'push-refused'
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ steps.merge.outputs.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          title="Sync with CleanYourTV needs a hand"
          open=$(gh api "repos/$REPO/issues?state=open&per_page=100" --jq "[.[] | select(.title == \"$title\")] | length")
          if [ "$open" != 0 ]; then
            echo "An issue is already open."
            exit 0
          fi
          if [ "$STATUS" = conflict ]; then
            why="Merging upstream main conflicts with this fork's changes (README.md and README.pt-BR.md are handled; the conflict is elsewhere)."
          else
            why="The merge is clean, but GitHub refused the push: upstream changed .github/workflows, which needs the SYNC_TOKEN secret (see the comment at the top of sync-upstream.yml)."
          fi
          body="$why

          Or run on a clone of this repository:

          \`\`\`bash
          git remote add upstream https://github.com/Gathin23/cleanyourtv.git  # once
          git fetch upstream && git merge upstream/main
          git checkout --ours README.md README.pt-BR.md  # keep our READMEs; then copy upstream's as the workflow does
          git show upstream/main:README.md > README.cleanyourtv.md
          git show upstream/main:README.pt-BR.md > README.cleanyourtv.pt-BR.md
          git push origin main
          \`\`\`

          Workflow run: $RUN_URL"
          gh api "repos/$REPO/issues" -f title="$title" -f body="$body" --jq .html_url
